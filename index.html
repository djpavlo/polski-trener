{id:"znac",icon:"\u{1F9E0}",title:"znać vs wiedzieć",color:"#7b2cbf",cards:[

{q:"... pan tę restaurację?\n(a) Zna  (b) Wie",a:"Zna",hint:"знать что → znać",rule:"znać + сущ. в Biernik.\n«Знаете этот ресторан?» → znać.\n\nZna pan tę restaurację?"},
